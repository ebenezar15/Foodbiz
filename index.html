<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Swt-er</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3B2420">
<meta name="description" content="Cost, price, orders, stock and break-even for home bakers and sweet makers, in rupees.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swt-er">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Desktop = dark sidebar + sticky page bar + content; phone/tablet = coloured top bar + bottom tab bar + "More" sheet.
   Colour: every palette defines light (-l) and dark (-d) raw values; the mode blocks map them onto the working tokens. */
:root{
  --bg-l:#FFF8EF; --sf-l:#FFFFFF; --s2-l:#F8ECE0; --ln-l:#EBD8CC; --ac-l:#C2315F; --ch-l:#3B2420;
  --bg-d:#160F0E; --sf-d:#211816; --s2-d:#2C201D; --ln-d:#40302B; --ac-d:#F28DB0; --ch-d:#1E1311;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --pad:18px; --gap:16px;

  --bg:var(--bg-l); --surface:var(--sf-l); --surface-2:var(--s2-l); --line:var(--ln-l);
  --ink:#211C19; --muted:#65605B; --accent:var(--ac-l); --accent-ink:#FFFFFF;
  --chrome:var(--ch-l); --chrome-ink:#F6EFE9;
  --gold:#A86C00; --good:#2C7444; --warn:#9A5F0C; --bad:#B42318;
  --good-soft:#DCEFE1; --warn-soft:#FAEACD; --bad-soft:#FBE2DE;
  --shadow:0 1px 2px rgb(30 20 10 / .06), 0 4px 16px rgb(30 20 10 / .05);
}
/* Dessert colour schemes (Swt-er brand is the default above) */
:root[data-palette="fudge"]{--bg-l:#F7F2EC;--s2-l:#EFE5DA;--ln-l:#DFD1C2;--ac-l:#8A4B22;--ch-l:#2E1A12;--bg-d:#15100C;--sf-d:#201813;--s2-d:#2B211A;--ln-d:#3D2F25;--ac-d:#E2A66B;--ch-d:#1A0F0A}
:root[data-palette="strawberry"]{--bg-l:#FBF4F5;--s2-l:#F6E6EA;--ln-l:#EBD3DA;--ac-l:#C2185B;--ch-l:#4A1530;--bg-d:#160E11;--sf-d:#21151A;--s2-d:#2D1D24;--ln-d:#422934;--ac-d:#F58FB5;--ch-d:#1E0B14}
:root[data-palette="pistachio"]{--bg-l:#F5F7EF;--s2-l:#E9EEDC;--ln-l:#D6DDC4;--ac-l:#557A26;--ch-l:#2F3B1E;--bg-d:#11140D;--sf-d:#1A1F14;--s2-d:#242B1C;--ln-d:#343E28;--ac-d:#B5D98A;--ch-d:#141A0D}
:root[data-palette="blueberry"]{--bg-l:#F5F4FA;--s2-l:#E9E7F4;--ln-l:#D6D3E8;--ac-l:#5146A8;--ch-l:#231E46;--bg-d:#100F17;--sf-d:#181622;--s2-d:#221F30;--ln-d:#332F45;--ac-d:#ACA3F2;--ch-d:#110F24}
:root[data-palette="kesar"]{--bg-l:#FBF6EC;--s2-l:#F5EAD3;--ln-l:#E7D7B8;--ac-l:#B25400;--ch-l:#3D2408;--bg-d:#15110A;--sf-d:#201A10;--s2-d:#2C2416;--ln-d:#3F3420;--ac-d:#FFB55C;--ch-d:#1B1006}
:root[data-palette="redvelvet"]{--bg-l:#FAF4F2;--s2-l:#F3E6E3;--ln-l:#E5D2CE;--ac-l:#A3192E;--ch-l:#3A0D14;--bg-d:#150D0D;--sf-d:#201515;--s2-d:#2C1D1D;--ln-d:#402B2B;--ac-d:#F2848F;--ch-d:#1A070A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:var(--bg-d); --surface:var(--sf-d); --surface-2:var(--s2-d); --line:var(--ln-d);
    --ink:#EEE9E4; --muted:#ADA69F; --accent:var(--ac-d); --accent-ink:#121212; --chrome:var(--ch-d); --chrome-ink:#EFE8E2;
    --gold:#E7B451; --good:#73C890; --warn:#E6AC52; --bad:#F38B7E; --good-soft:#1C3324; --warn-soft:#3A2B12; --bad-soft:#3E1F1A;
    --shadow:0 1px 2px rgb(0 0 0 / .3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
  --bg:var(--bg-d); --surface:var(--sf-d); --surface-2:var(--s2-d); --line:var(--ln-d);
  --ink:#EEE9E4; --muted:#ADA69F; --accent:var(--ac-d); --accent-ink:#121212; --chrome:var(--ch-d); --chrome-ink:#EFE8E2;
  --gold:#E7B451; --good:#73C890; --warn:#E6AC52; --bad:#F38B7E; --good-soft:#1C3324; --warn-soft:#3A2B12; --bad-soft:#3E1F1A;
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}
:root[data-density="compact"]{--pad:12px;--gap:10px;--r:10px}
:root{--accent-soft:color-mix(in srgb, var(--accent) 15%, var(--surface)); --accent-line:color-mix(in srgb, var(--accent) 45%, var(--line))}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.9375rem;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.04rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .small{font-size:.84rem} .tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{font-size:.78rem;color:var(--muted);line-height:1.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--chrome);color:var(--chrome-ink);padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.brand{display:grid;justify-items:start;gap:2px;padding:2px 10px 10px;min-width:0}
.brandlogo{width:150px;height:auto;display:block;margin-left:-6px}
.brand small{padding-left:2px}
img.mlogo{height:30px;width:auto;flex:none}
@media (max-width:360px){img.mlogo{height:24px}}
.brand b{font-family:var(--font-display);font-size:1.12rem;display:block;line-height:1.1}
.brand small{display:block;font-size:.74rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.side .grp{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.55;padding:14px 12px 4px}
.nav a{display:flex;gap:11px;align-items:center;padding:8px 12px;border-radius:9px;color:inherit;text-decoration:none;opacity:.82;font-size:.9rem;font-weight:500}
.nav a:hover{opacity:1;background:color-mix(in srgb, var(--chrome-ink) 8%, transparent)}
.nav a[aria-current="page"]{opacity:1;background:color-mix(in srgb, var(--chrome-ink) 15%, transparent);font-weight:600}
.nav a .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;padding:12px 10px 0;display:flex;gap:6px}
.side-foot button{flex:1;background:color-mix(in srgb, var(--chrome-ink) 10%, transparent);color:var(--chrome-ink);border:0;border-radius:8px;padding:7px;font:inherit;font-size:.78rem;cursor:pointer}
.side-foot button[aria-pressed="true"]{background:var(--chrome-ink);color:var(--chrome)}
.content{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:6;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:10px;padding-block:12px}
.bar .ttl{min-width:0;flex:1}
.bar .ttl p{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .mlogo{display:none !important}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{padding-block:20px 48px}
.bottom{display:none}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
  .bar{top:env(safe-area-inset-top,0px);background:var(--chrome);color:var(--chrome-ink);border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .bar .ttl p{color:var(--chrome-ink);opacity:.7}
  .bar .mlogo{display:block !important}
  .bar .btn{background:color-mix(in srgb, var(--chrome-ink) 12%, transparent);color:var(--chrome-ink);border-color:transparent}
  .bar .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .bar .btn .lbl{display:none}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 18px rgb(0 0 0 / .06)}
  .bottom a,.bottom button{position:relative;display:grid;justify-items:center;gap:2px;padding:7px 0 8px;font:inherit;font-size:.7rem;font-weight:500;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
  .bottom [aria-current="page"]{color:var(--accent);font-weight:700}
  .bottom .badge{position:absolute;top:2px;left:calc(50% + 6px);height:17px;min-width:17px;font-size:.62rem}
}
@media (max-width:420px){ h1{font-size:1.2rem} }

/* ---------- building blocks ---------- */
.lead{color:var(--muted);max-width:68ch;margin-bottom:var(--gap)}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1100px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:var(--gap);min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h p{width:100%}
.card-h .seg{margin:0}
.result{border-color:var(--accent-line)}
.sticky{position:sticky;top:84px}
@media (max-width:1100px),(max-height:760px){.sticky{position:static}}
.qnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;margin-right:8px;font-family:var(--font-body)}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:4px;align-content:start;min-width:0}
.field > label,.lbl{font-size:.8rem;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb, var(--accent) 25%, transparent);outline-offset:0}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0;min-height:28px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--accent);flex:none;margin:0}
input[type=color]{padding:3px;width:52px;height:40px;cursor:pointer}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.unitin{display:flex;align-items:center;gap:6px}
.unitin input{width:96px}
.unitin span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.money-in{position:relative;display:block}
.money-in::before{content:"₹";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.88rem;pointer-events:none}
.money-in input{padding-left:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;min-height:38px;cursor:pointer;font:inherit;font-size:.86rem;font-weight:600;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 50%, var(--line))}
.btn.small{padding:5px 10px;min-height:32px;font-size:.8rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn svg.i{width:17px;height:17px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.x{border:0;background:transparent;color:var(--muted);font-size:1.25rem;line-height:1;cursor:pointer;padding:6px 9px;border-radius:7px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.linkish{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.84rem;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}
.seg{display:inline-flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:3px;background:var(--surface-2);border-radius:11px;padding:3px;margin-bottom:var(--gap);max-width:100%}
.seg button{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.86rem;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n{font-weight:500;color:var(--muted);margin-left:5px}

.tbl{overflow-x:auto;margin-inline:calc(-1 * var(--pad));padding-inline:var(--pad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td select{min-width:150px}
td input[type=number]{min-width:76px}
td input[type=text]{min-width:140px}
tfoot td{font-weight:700;border-top:1.5px solid var(--ink)}

.big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv .total{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.bars{display:grid;gap:9px}
.bar-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.86rem}
.track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.gold{background:var(--gold)} .fill.good{background:var(--good)} .fill.bad{background:var(--bad)}
.progress{height:12px;border-radius:6px}
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);align-items:center}
.rung.rec{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.rung .p{font-family:var(--font-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rung.rec .p{font-size:1.75rem}
.rung .d{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.73rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tips{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.tips li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.88rem;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.tips li.bad{background:var(--bad-soft)} .tips li.warn{background:var(--warn-soft)} .tips li.good{background:var(--good-soft)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--accent)}
.bad>.dot{background:var(--bad)} .warn>.dot{background:var(--warn)} .good>.dot{background:var(--good)}
.tips li a{font-weight:600;font-size:.8rem;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--gap)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-family:var(--font-display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.tile .v.pos{color:var(--good)} .tile .v.neg{color:var(--bad)}
@media (max-width:640px){.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1}}
.tile.hl{border-color:var(--accent-line);background:var(--accent-soft)}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:var(--gap)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:var(--gap)}
.labelcard{border:1.5px dashed var(--ink);border-radius:10px;padding:14px;font-size:.86rem;display:grid;gap:4px;background:var(--bg)}
.vegmark{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--good);vertical-align:-3px;margin-right:6px}
.vegmark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.guide ul,.guide ol{margin:6px 0 0;padding-left:1.2em;display:grid;gap:5px;font-size:.9rem}
.guide p{font-size:.9rem;max-width:70ch}
.guide p + p{margin-top:8px}

    d.be = {investment:0, invNote:'', start:thisMonth(), autoFixed:true, ownerPay:0};
    d.settings = {palette:'swetr', mode:'system', accent:'', density:'comfortable', textSize:100};
    d.v = 2;
  }
  if (d.v === 2){
    if (d.settings) d.settings.palette = OLD_PALETTE[d.settings.palette] || d.settings.palette;
    if (d.sample){ const b = blankState(); b.settings = d.settings || b.settings; b.backup = d.backup || b.backup; return b; }   // sample data: start clean
    d.entries = (d.entries || []).filter(e => !e.ex);                                         // drop example entries
    d.backup = d.backup || {email:'', last:'', clientId:''};
    d.v = 3;
  }
  if (d.settings && !PALETTES.some(x => x[0] === d.settings.palette)) d.settings.palette = 'swetr';
  if (d.profile && /^swe-?tr( desserts)?$/i.test((d.profile.business || '').trim())) d.profile.business = BRAND_NAME;   // renamed brand
  if (d.v === 3 && d.sample){ const b = blankState(); b.settings = d.settings || b.settings; b.backup = d.backup || b.backup; return b; }   // never keep sample data
  if (d.v === 3 && d.entries) d.entries = d.entries.filter(e => !e.ex);
  if (d.v === 3 && !d.brand){ if (d.settings && (!d.settings.palette || d.settings.palette === 'fudge') && !d.settings.accent) d.settings.palette = 'swetr'; if (d.profile && !d.profile.business) d.profile.business = BRAND_NAME; d.brand = 1; }

   calculations
   ========================================================= */
const ingById = id => S.ingredients.find(i => i.id === id);
const pkgById = id => S.packaging.find(p => p.id === id);
const recById = id => S.recipes.find(r => r.id === id);
const baseUnit = g => (UNITS[g.packUnit] || UNITS.g)[0];
const packSize = g => num(g.packQty) * (UNITS[g.packUnit] || UNITS.g)[1];
const perBase = g => { const q = packSize(g); return q > 0 ? num(g.packPrice) / q : 0; };
const sumFixed = () => S.profile.fixed.reduce((a, f) => a + num(f.amt), 0);
function rateText(g){ const b = baseUnit(g), pu = perBase(g); return b === 'pcs' ? inr(pu) + ' each' : (b === 'g' || b === 'ml') ? inr(pu * 1000) + (b === 'g' ? ' / kg' : ' / L') : inr(pu) + ' / ' + b; }

function recipeCost(r){
  const P = S.profile;
  let ingr = 0;
  r.lines.forEach(l => { const g = ingById(l.ingId); if (g) ingr += lineBase(l) * perBase(g); });
  const ingW = ingr * (1 + num(r.wastage) / 100);
  const ovenMin = num(r.bakeMin) > 0 ? num(r.bakeMin) + num(r.preheatMin) : 0;
  const kwh = num(P.ovenWatts) / 1000 * ovenMin / 60 * 0.7;
  const elec = kwh * num(P.elecRate);
  const gas = num(r.gasMin) / 60 * num(P.burnerKgHr) * num(P.lpgPrice) / 14.2;
  const labour = num(r.activeMin) / 60 * num(P.labourRate);
  const batch = ingW + elec + gas + labour;
  const y = Math.max(1, num(r.yield));
  let pack = 0;
  r.pack.forEach(p => { const k = pkgById(p.pkgId); if (k) pack += num(k.price) / Math.max(1, num(p.perPieces)); });
  const fixed = sumFixed() / Math.max(1, num(P.monthlyPieces));
  const tr = transportPer(), transport = tr.total;
  const perPiece = batch / y + pack + fixed + transport;
  return {ingr, ingW, elec, gas, labour, batch, pack, fixed, transport, tr, perPiece, variable:perPiece - fixed, y, kwh};
}
function priceFor(cost, margin, fee = 0){ const d = 1 - margin / 100 - fee / 100; return d > 0.05 ? cost / d : NaN; }
function roundPrice(p){
  if (!isFinite(p)) return p;
  if (S.profile.rounding === 'none') return Math.ceil(p);
  const step = p < 20 ? 1 : p < 100 ? 5 : p < 500 ? 10 : 50;
  let c = Math.ceil(p / step) * step;
  if (step >= 5 && c % 10 === 0 && c - 1 >= p) c -= 1;
  return c;
}
const recPrice = r => roundPrice(priceFor(recipeCost(r).perPiece, num(r.margin)));
function tierFor(qty){ let d = 0; [...S.profile.tiers].sort((a, b) => num(a.min) - num(b.min)).forEach(t => { if (num(qty) >= num(t.min)) d = num(t.disc); }); return d; }
const autoUnit = (r, qty) => r ? Math.round(recPrice(r) * (1 - tierFor(qty) / 100)) : 0;
const marginOf = (price, cost, fee = 0) => price > 0 ? (price * (1 - fee / 100) - cost) / price * 100 : NaN;
const health = m => m >= 25 ? ['good','Healthy'] : m >= 10 ? ['warn','Thin'] : ['bad', m < 0 ? 'Loss' : 'Too low'];

/* ---------- shelf life ---------- */
function shelfCalc(s){
  const c = catById(s.cat);
  let room = c.room, fridge = c.fridge, freezer = c.freezer;
  const notes = [];
  if (s.climate === 'hot'){ room *= 0.75; notes.push(['warn', 'A hot or humid kitchen without AC cuts room-temperature life by about a quarter. Indian summers and monsoons are when most home bakes spoil early.']); }
  if (s.fresh){ room = Math.min(room, 0.25); fridge = fridge == null ? 3 : Math.min(fridge, 3); notes.push(['bad', 'Fresh fruit, fresh cream, cream cheese or custard: keep it chilled, and treat 3 days in the fridge as the limit.']); }
  if (s.dairy && !['milk', 'cream'].includes(s.cat)){ room *= 0.7; if (fridge) fridge *= 0.85; notes.push(['warn', 'Khoya, paneer, milk or mawa in the recipe shortens life.']); }
  if (s.moisture === 'high'){ room *= 0.8; if (fridge) fridge *= 0.85; notes.push(['info', 'Very moist or gooey centres spoil faster than firm, dry ones.']); }
  if (s.moisture === 'low') room *= 1.15;
  const pk = {open:0.6, airtight:1, sealed:1.3}[s.pack] || 1;
  room *= pk; if (fridge) fridge *= Math.min(pk, 1.15);
  if (s.pack === 'open') notes.push(['warn', 'Loose wrapping (butter paper, an open tray) lets in air and moisture. Use a closed box or pouch.']);
  if (s.pack === 'sealed') notes.push(['good', 'Heat-sealed or vacuum packs slow staling and drying. They do not stop bacteria in moist or dairy foods.']);
  const useFridge = room < 1 || s.fresh || s.cat === 'cream' || s.cat === 'milk';
  return {c, room, fridge, freezer, useFridge, notes, label:(useFridge ? fridge : room) * 0.7};
}
function dur(d){
  if (d == null) return 'Not advised';
  if (d < 1) return Math.max(1, Math.round(d * 24)) + ' hours';
  if (d >= 60) return Math.round(d / 30) + ' months';
  const f = Math.floor(d); return f + (f === 1 ? ' day' : ' days');
}
const productLifeDays = r => shelfCalc({cat:r.cat, climate:S.profile.climate || 'hot', fresh:false, dairy:false, moisture:'normal', pack:'airtight'}).label;

/* ---------- stock ---------- */
const lotOk = l => num(l.left) > 0 && (!l.exp || daysUntil(l.exp) >= 0);
const lotExpired = l => num(l.left) > 0 && l.exp && daysUntil(l.exp) < 0;
const stockOf = g => (g.lots || []).filter(lotOk).reduce((a, l) => a + num(l.left), 0);
const expiredQty = g => (g.lots || []).filter(lotExpired).reduce((a, l) => a + num(l.left), 0);
const nextExpiry = g => (g.lots || []).filter(l => lotOk(l) && l.exp).map(l => l.exp).sort()[0] || null;
const tracked = g => (g.lots || []).length > 0 || num(g.low) > 0;
function ingStatus(g){
  const s = stockOf(g), ne = nextExpiry(g);
  if (expiredQty(g) > 0) return ['bad', 'Has expired stock'];
  if (s <= 0) return tracked(g) ? ['bad', 'Out of stock'] : ['', 'Not tracked'];
  if (ne && daysUntil(ne) <= 7) return ['warn', cap(expIn(ne))];
  if (num(g.low) > 0 && s <= num(g.low)) return ['warn', 'Running low'];
  return ['good', 'In stock'];
}
function pkgStatus(k){ const s = num(k.stock); if (s <= 0) return num(k.low) > 0 ? ['bad', 'Out of stock'] : ['', 'Not tracked']; if (num(k.low) > 0 && s <= num(k.low)) return ['warn', 'Running low']; return ['good', 'In stock']; }
function takeIng(g, qty){
  let need = qty;
  const lots = (g.lots || []).filter(lotOk).sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999') || String(a.date).localeCompare(String(b.date)));
  for (const l of lots){ if (need <= 1e-6) break; const t = Math.min(num(l.left), need); l.left = +(num(l.left) - t).toFixed(3); need -= t; }
  g.lots = (g.lots || []).filter(l => num(l.left) > 0);
  return Math.max(0, need);
}
const readyLots = rid => S.finished.filter(f => f.recipeId === rid && num(f.left) > 0 && daysUntil(f.exp) >= 0).sort((a, b) => a.exp.localeCompare(b.exp));
const readyOf = rid => readyLots(rid).reduce((a, f) => a + num(f.left), 0);
function takeReady(rid, pcs){ let need = pcs; for (const f of readyLots(rid)){ if (need <= 0) break; const t = Math.min(num(f.left), need); f.left -= t; need -= t; } S.finished = S.finished.filter(f => num(f.left) > 0); return pcs - need; }
function needsFor(r, pieces){
  const f = pieces / Math.max(1, num(r.yield)) * (1 + num(r.wastage) / 100);
  const ing = {}, pk = {};
  r.lines.forEach(l => { ing[l.ingId] = (ing[l.ingId] || 0) + lineBase(l) * f; });
  for (const k in ing){ const g = ingById(k); if (g && baseUnit(g) === 'pcs') ing[k] = Math.ceil(ing[k] - 1e-6); }
  r.pack.forEach(p => { pk[p.pkgId] = (pk[p.pkgId] || 0) + pieces / Math.max(1, num(p.perPieces)); });
  return {ing, pk};
}
function produce(r, pcs){
  const warn = [], n = needsFor(r, pcs);
  for (const [id, q] of Object.entries(n.ing)){ const g = ingById(id); if (!g) continue; const was = tracked(g); const short = takeIng(g, q); if (short > 0.01 && was) warn.push(`${g.name} short by ${fmtQty(short, baseUnit(g))}`); }
  for (const [id, q] of Object.entries(n.pk)){ const k = pkgById(id); if (!k) continue; const need = Math.ceil(q - 1e-6); if (num(k.stock) < need && (num(k.stock) > 0 || num(k.low) > 0)) warn.push(`${k.name} short by ${need - num(k.stock)}`); k.stock = Math.max(0, num(k.stock) - need); }
  return warn;
}
function logPrice(g){
  g.history = g.history || [];
  const last = g.history[g.history.length - 1];
  if (!last || num(last.price) !== num(g.packPrice)){ if (last && last.date === today()) last.price = num(g.packPrice); else g.history.push({date:today(), price:num(g.packPrice)}); }
  g.updated = today();
}

/* ---------- orders ---------- */
function orderCalc(o){
  let sub = 0, cost = 0, pcs = 0;
  const lines = o.items.map(it => {
    const r = recById(it.recipeId); if (!r) return null;
    const qty = num(it.qty), unit = num(it.unit) || autoUnit(r, qty);
    sub += unit * qty; cost += recipeCost(r).perPiece * qty; pcs += qty;
    return {r, qty, unit, line:unit * qty};
  }).filter(Boolean);
  const goods = Math.max(0, sub - num(o.discount)), taxable = goods + num(o.extras);
  const gst = S.profile.gst === 'yes' ? Math.round(taxable * num(S.profile.gstRate) / 100) : 0;
  const total = taxable + gst + num(o.delivery);
  const paid = o.status === 'delivered' ? total : num(o.advance);
  return {lines, sub, cost, pcs, gst, total, paid, profit:goods - cost, balance:total - paid};
}
const openOrders = () => S.orders.filter(o => o.status === 'open');
function plan(orders){
  const prod = {};
  orders.forEach(o => o.items.forEach(it => { if (recById(it.recipeId)) prod[it.recipeId] = (prod[it.recipeId] || 0) + num(it.qty); }));
  const rows = Object.entries(prod).map(([rid, pcs]) => { const r = recById(rid); const ready = Math.min(readyOf(rid), pcs); const make = pcs - ready; return {r, pcs, ready, make, batches:make / Math.max(1, num(r.yield))}; });
  const ing = {}, pk = {};
  rows.forEach(x => { if (x.make <= 0) return; const n = needsFor(x.r, x.make); for (const k in n.ing) ing[k] = (ing[k] || 0) + n.ing[k]; for (const k in n.pk) pk[k] = (pk[k] || 0) + n.pk[k]; });
  const ingRows = Object.entries(ing).map(([id, q]) => { const g = ingById(id); if (!g) return null; const have = stockOf(g), short = Math.max(0, q - have), ps = packSize(g) || 1, packs = short > 0 ? Math.ceil(short / ps) : 0;
    return {g, need:q, have, left:have - q, short, packs, buy:packs * num(g.packPrice), use:q * perBase(g)}; }).filter(Boolean).sort((a, b) => b.short - a.short || a.g.name.localeCompare(b.g.name));
  const pkRows = Object.entries(pk).map(([id, q]) => { const k = pkgById(id); if (!k) return null; const need = Math.ceil(q - 1e-6), have = num(k.stock), short = Math.max(0, need - have); return {k, need, have, left:have - need, short, buy:short * num(k.price)}; }).filter(Boolean);
  let value = 0, cost = 0, profit = 0; orders.forEach(o => { const c = orderCalc(o); value += c.total; cost += c.cost; profit += c.profit; });
  const fuelTime = rows.reduce((a, x) => { const c = recipeCost(x.r); return a + (c.elec + c.gas + c.labour) * x.batches; }, 0);
  return {rows, ingRows, pkRows, value, cost, profit, fuelTime,
    ingCost:ingRows.reduce((a, x) => a + x.use, 0), buyCost:ingRows.reduce((a, x) => a + x.buy, 0) + pkRows.reduce((a, x) => a + x.buy, 0)};
}

/* ---------- money & break-even ---------- */
function monthSum(ym){
  const es = S.entries.filter(e => e.date.startsWith(ym));
  const sales = es.filter(e => e.kind === 'sale').reduce((a, e) => a + num(e.amount), 0);
  const exp = es.filter(e => e.kind === 'expense').reduce((a, e) => a + num(e.amount), 0);
  return {es, sales, exp, profit:sales - exp};
}
const monthLabel = ym => { const [y, m] = ym.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-IN', {month:'short', year:'numeric'}); };
function shiftMonth(ym, k){ const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function monthBE(ym){
  const B = S.be, m = monthSum(ym);
  const base = B.start && ym < B.start ? 0 : (B.autoFixed ? sumFixed() : 0) + num(B.ownerPay);
  const costs = m.exp + base, profit = m.sales - costs;
  let cum = -base, date = null;
  [...m.es].sort((a, b) => a.date.localeCompare(b.date) || (a.kind === 'expense' ? -1 : 1)).forEach(e => {
    const before = cum; cum += e.kind === 'sale' ? num(e.amount) : -num(e.amount);
    if (before < 0 && cum >= 0) date = e.date; if (cum < 0) date = null;
  });
  return {ym, sales:m.sales, exp:m.exp, base, costs, profit, ok:profit >= 0 && m.sales > 0, date};
}
function avgContribution(){
  const xs = S.recipes.map(r => recPrice(r) - recipeCost(r).variable).filter(x => x > 0);
  return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
}
function payback(){
  const B = S.be, inv = num(B.investment), end = thisMonth();
  let ym = B.start || end, cum = 0, months = [], guard = 0;
  while (ym <= end && guard++ < 120){ const b = monthBE(ym); cum += b.profit; months.push(b); ym = shiftMonth(ym, 1); }
  const recent = months.slice(-3), avg = recent.length ? recent.reduce((a, b) => a + b.profit, 0) / recent.length : 0;
  const left = inv - cum;
  return {inv, cum, left, done:inv > 0 && cum >= inv, pct:inv > 0 ? Math.max(0, Math.min(100, cum / inv * 100)) : 0, avg, monthsLeft:left > 0 && avg > 0 ? Math.ceil(left / avg) : null, months};
}

/* ---------- alerts ---------- */
function alerts(){
  const a = [];
  S.orders.filter(o => o.status !== 'delivered' && daysUntil(o.due) < 0).forEach(o => a.push(['bad', `Order “${esc(o.customer)}” was due ${fmtDate(o.due)} and is not delivered.`, 'orders']));
  const p = plan(openOrders());
  p.ingRows.filter(x => x.short > 0).forEach(x => a.push(['bad', `Open orders need ${fmtQty(x.short, baseUnit(x.g))} more ${esc(x.g.name)} than you have.`, 'orders']));
  p.pkRows.filter(x => x.short > 0).forEach(x => a.push(['bad', `Open orders need ${x.short} more × ${esc(x.k.name)}.`, 'orders']));
  S.ingredients.forEach(g => {
    const ex = expiredQty(g); if (ex > 0) a.push(['bad', `${esc(g.name)}: ${fmtQty(ex, baseUnit(g))} is past its expiry. Discard it.`, 'stock']);
    const ne = nextExpiry(g); if (ne && daysUntil(ne) <= 7) a.push(['warn', `${esc(g.name)} ${expIn(ne)} (${fmtDate(ne)}). Use it first.`, 'stock']);
    const s = stockOf(g); if (num(g.low) > 0 && s <= num(g.low) && s > 0) a.push(['warn', `${esc(g.name)} is low: ${fmtQty(s, baseUnit(g))} left.`, 'stock']);
  });
  S.packaging.forEach(k => { if (num(k.low) > 0 && num(k.stock) <= num(k.low)) a.push(['warn', `${esc(k.name)}: ${num(k.stock)} left.`, 'stock']); });
  S.finished.forEach(f => { const r = recById(f.recipeId); if (!r || num(f.left) <= 0) return; const n = daysUntil(f.exp);
    if (n < 0) a.push(['bad', `${f.left} ${esc(r.name)} made ${fmtDate(f.made)} are past best-before. Do not sell them.`, 'stock']);
    else if (n <= 2) a.push(['warn', `${f.left} ready ${esc(r.name)} ${expIn(f.exp)}. Sell or use them first.`, 'stock']); });
  return a;
}

function getStarted(){

    [!!(P.phone && P.upi), 'Add your phone and UPI ID for bills, and answer the setup questions', 'Open setup', 'data-act="go" data-hash="setup" data-tab="business"'],

}
function backupNudge(){
  const hasData = S.recipes.length || S.entries.length || S.orders.length;
  if (!hasData || !S.backup.last) return '';
  const days = Math.floor((Date.now() - new Date(S.backup.last)) / 864e5);
  if (days < 7) return '';

function oRecipes(){

  if (noPrice.length) tips.unshift(['bad', `No price yet for ${noPrice.map(esc).join(', ')}. The cost is too low until you add ${noPrice.length > 1 ? 'them' : 'it'} on the Stock page.`, 'stock']);

function quoteCalc(){
  const Q = S.quote, P = S.profile;
  let sub = 0, cost = 0, pcs = 0;
  const rows = Q.rows.map(row => {
    const r = recById(row.recipeId); if (!r) return null;
    const qty = num(row.qty), disc = tierFor(qty), unit = autoUnit(r, qty), line = unit * qty;
    sub += line; cost += recipeCost(r).perPiece * qty; pcs += qty;
    return {r, qty, disc, unit, line, cat:r.cat};
  }).filter(Boolean);
  const custom = num(Q.customPack) * pcs, rush = Math.round(sub * num(Q.rush) / 100), delivery = num(Q.delivery);
  const taxable = sub + custom + rush, gst = P.gst === 'yes' ? Math.round(taxable * num(P.gstRate) / 100) : 0, total = taxable + delivery + gst;
  return {rows, sub, cost, pcs, custom, rush, delivery, gst, total, profit:sub + rush - cost, margin:marginOf(sub + rush, cost), advance:Math.ceil(total * num(Q.advance) / 100)};
}

function trackerTips(m, byCat){
  const t = [];
  if (m.sales && m.profit / m.sales < 0.2) t.push(['warn', 'Sales minus expenses is under 20% of sales. Compare your actual prices with the Pricing page, and check for unplanned discounts.']);
  if (m.sales && (byCat['Ingredients'] || 0) / m.sales > 0.45) t.push(['warn', 'Ingredients are more than 45% of sales. Buy butter, chocolate and nuts in bulk, or review recipe quantities and wastage.']);
  if (m.sales && (byCat['Packaging'] || 0) / m.sales > 0.15) t.push(['warn', 'Packaging is above 15% of sales. Order boxes in larger lots or use simpler packaging for everyday orders.']);
  if (!t.length && m.sales) t.push(['good', 'Spending looks balanced against sales this month.']);
  t.push(['info', 'Keep a photo of every bill, and keep business money in a separate UPI ID or bank account.']);
  return t;
}
function chart6(ym){
  const ms = [5,4,3,2,1,0].map(k => shiftMonth(ym, -k));
  const data = ms.map(x => { const b = monthBE(x); return {sales:b.sales, exp:b.costs}; });
  const W = 560, H = 220, L = 52, B = 26, T = 10, R = 8;
  const max = Math.max(1000, ...data.map(d => Math.max(d.sales, d.exp)));
  const mag = Math.pow(10, Math.floor(Math.log10(max)));
  const stepv = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => max / s <= 5) || mag * 10;
  const top = Math.ceil(max / stepv) * stepv, y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / 6, bw = Math.min(26, gw / 3);
  let g = '';
  for (let v = 0; v <= top + 0.1; v += stepv){
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v >= 1000 ? '₹' + (v / 1000).toLocaleString('en-IN') + 'k' : '₹' + v}</text>`;
  }
  data.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    g += `<rect x="${cx - bw - 1}" y="${y(d.sales)}" width="${bw}" height="${Math.max(0, H - B - y(d.sales))}" rx="3" fill="var(--accent)"><title>${monthLabel(ms[i])} sales ${inr(d.sales)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0, H - B - y(d.exp))}" rx="3" fill="var(--gold)"><title>${monthLabel(ms[i])} costs ${inr(d.exp)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${ms[i] === ym ? 'var(--ink)' : 'var(--muted)'}" font-weight="${ms[i] === ym ? 700 : 400}">${monthLabel(ms[i]).split(' ')[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales and costs for the last six months">${g}</svg>`;
}

function packAdvice(a){
  const items = (PK[a.cat] || []).map(x => ({name:x[0], lo:x[1], hi:x[2]})), tips = [];
  if (a.purpose === 'gift'){ items.push({name:'Rigid or window gift box', lo:40, hi:120}, {name:'Ribbon or twine', lo:2, hi:5}, {name:'Thank-you card or tag', lo:1, hi:3}); tips.push(['info', 'Gift orders can carry premium packaging. Price them at the Premium rung, not the everyday price.']); }
  if (a.purpose === 'everyday') tips.push(['good', 'For everyday orders keep packaging to about 5–12% of the selling price. Customers pay for what is inside.']);
  if (a.purpose === 'bulk'){ items.push({name:'Bulk tray or large box, 25–50 pieces', lo:20, hi:60}, {name:'Outer 3-ply corrugated carton', lo:15, hi:40}); tips.push(['info', 'Bulk and corporate orders: pack in trays, and charge for wrapping each piece only if they will hand pieces out one by one.']); }
  if (a.distance === 'city') tips.push(['warn', 'Across the city: use a rigid box with the lid taped or stickered shut, keep boxes flat in a delivery bag, and do not stack heavy boxes on soft bakes.']);
  if (a.distance === 'courier'){
    items.push({name:'Bubble wrap', lo:5, hi:15}, {name:'Outer 3-ply corrugated box', lo:15, hi:40});
    const life = shelfCalc({cat:a.cat, climate:'hot', fresh:false, dairy:false, moisture:'normal', pack:'sealed'});
    tips.push(life.label >= 7 ? ['good', 'This product keeps long enough to courier. Heat-seal the inner pack, cushion it, and mark the box “Food, handle with care”.'] : ['bad', `Not suited to courier. It keeps about ${dur(life.label)}, and courier takes 2–5 days. Sell it locally only.`]);
    if (a.cat === 'choc') tips.push(['warn', 'Chocolate melts above about 28 °C. Avoid shipping in summer, or use insulated packs and express delivery.']);
  }
  if (a.eco){ items.push({name:'Bagasse (sugarcane) box or tray', lo:6, hi:15}); tips.push(['info', 'Kraft paper and bagasse look good and compost, but paper is not a moisture barrier. Line it with butter paper, and keep crisp items in a sealed inner pouch.']); }
  if (a.cat === 'cream' || a.cat === 'milk') tips.push(['warn', 'Keep these cold until handover. Put a “Keep refrigerated” sticker on every box.']);
  tips.push(['info', 'Every pack needs a label: product name, ingredients, allergens, net weight, date of making, best-before, veg/non-veg mark, FSSAI number and your address. See the Guide.']);
  return {items, tips};
}

  if (P.channels.includes('Exhibitions & pop-ups')) out.push(['info', 'Log stall fees, travel and samples as expenses for each event, and price event packs so a day covers the stall at least three times over.']);
  if (P.channels.includes('Corporate & events')) out.push(['info', 'Corporate buyers often ask for a GST invoice, a tasting sample and a fixed quote. Keep quote validity short (7 days).']);
  if (P.buyers !== 'individual') out.push(['good', `For bulk orders: take an advance, keep a minimum order (yours is ${P.minOrder} pieces), and give at least ${P.leadDays} days' lead time.`]);
  if (fixedPer > 8) out.push(['warn', `Fixed costs add ${inr(fixedPer)} to every piece at ${P.monthlyPieces} pieces a month. Selling more, or trimming fixed costs, lowers this.`]);
  if (P.products.includes('Indian sweets') || P.products.includes('Cakes & cupcakes')) out.push(['info', 'Milk sweets and fresh-cream cakes last only days. Make them to order and check the Shelf life page for a safe date.']);
  if (P.gst === 'yes') out.push(['info', `You are GST registered: add ${P.gstRate}% GST on invoices and show menu prices inclusive of GST.`]);
  else out.push(['info', 'Not GST registered? Then do not charge GST. Registration is usually needed once yearly turnover for goods crosses ₹40 lakh (₹20 lakh in some states). Check with a CA.']);
  out.push(['info', `At ₹${P.elecRate} a unit, a ${P.ovenWatts} W oven costs about ${inr(P.ovenWatts / 1000 * 0.7 * P.elecRate)} an hour to run.`]);
  return out;
}

/* ---------- barcode scanning ---------- */
const SCAN = {stream:null, timer:null, reader:null};
function loadZX(){
  if (window.ZXing) return Promise.resolve();
  return loadZX.p || (loadZX.p = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = res; s.onerror = () => { loadZX.p = null; rej(new Error('load')); }; document.head.appendChild(s); }));
}
const BD_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'];
async function makeDetector(){ if (!('BarcodeDetector' in window)) return null; try { const ok = await BarcodeDetector.getSupportedFormats(); const f = BD_FORMATS.filter(x => ok.includes(x)); return f.length ? new BarcodeDetector({formats:f}) : null; } catch(e){ return null; } }
function scanMsg(msg, kind){ if (!MODAL || MODAL.type !== 'scan') return; MODAL.msg = msg; MODAL.msgKind = kind || ''; renderModal(); }
async function startCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanMsg('The camera is not available here. Take a photo of the barcode instead, or type the number.', 'warn'); return; }
  MODAL.live = true; MODAL.msg = 'Point the camera at the barcode and hold steady.'; MODAL.msgKind = 'acc'; renderModal();
  const v = $('#scanVideo');
  try {
    const det = await makeDetector();
    if (det){
      SCAN.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
      v.srcObject = SCAN.stream; await v.play();
      const tick = async () => { if (!SCAN.stream) return; try { const c = await det.detect(v); if (c && c[0]) return onCode(c[0].rawValue); } catch(e){} SCAN.timer = setTimeout(tick, 220); };
      tick();
    } else {
      await loadZX();
      SCAN.reader = new ZXing.BrowserMultiFormatReader();
      await SCAN.reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}}, v, res => { if (res) onCode(res.getText()); });
      SCAN.stream = v.srcObject;
    }
  } catch(e){
    stopCamera(); if (MODAL) MODAL.live = false;
    scanMsg(e && e.name === 'NotAllowedError' ? 'Camera permission was refused. Take a photo of the barcode instead, or type the number.' : 'The camera could not start here. Take a photo of the barcode instead, or type the number.', 'warn');
  }
}
function stopCamera(){
  clearTimeout(SCAN.timer);
  try { SCAN.reader && SCAN.reader.reset(); } catch(e){}
  if (SCAN.stream) SCAN.stream.getTracks().forEach(t => t.stop());
  SCAN.stream = null; SCAN.reader = null;
}
async function scanImage(file){
  scanMsg('Reading the photo…', 'acc');
  try {
    const det = await makeDetector();
    if (det){ const bmp = await createImageBitmap(file); const c = await det.detect(bmp); if (c[0]) return onCode(c[0].rawValue); throw new Error('none'); }
    await loadZX();
    const url = URL.createObjectURL(file);
    try { const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url); return onCode(r.getText()); } finally { URL.revokeObjectURL(url); }
  } catch(e){ scanMsg(e && e.message === 'load' ? 'The barcode reader could not load. Type the number under the barcode instead.' : 'No barcode found in that photo. Fill the frame with the barcode, keep it sharp and well lit, and try again.', 'warn'); }
}
function parseQty(s){
  const m = String(s || '').toLowerCase().replace(',', '.').match(/([\d.]+)\s*(kg|g|gm|grams?|l|ltr|litres?|liters?|ml|pcs|pieces?)\b/);
  if (!m) return null;
  const n = parseFloat(m[1]), u = m[2];
  if (/^k/.test(u)) return [n, 'kg']; if (/^(g|gm|gram)/.test(u)) return [n, 'g']; if (/^ml/.test(u)) return [n, 'ml']; if (/^l/.test(u)) return [n, 'L']; return [n, 'pcs'];
}
async function onCode(raw){
  const code = String(raw || '').trim(); if (!code) return;
  stopCamera();
  const g = S.ingredients.find(x => x.barcode && x.barcode === code);
  if (g){ openModal({type:'stockIn', kind:'ing', id:g.id, packs:1, price:num(g.packPrice), date:today(), exp:'', expense:true, note:`Scanned: ${g.name}`}); return; }
  const k = S.packaging.find(x => x.barcode && x.barcode === code);
  if (k){ openModal({type:'stockIn', kind:'pkg', id:k.id, packs:1, price:num(k.price), date:today(), exp:'', expense:true, note:`Scanned: ${k.name}`}); return; }
  openModal({type:'scanNew', code, link:'new', name:'', packQty:1, packUnit:'kg', price:'', packs:1, exp:'', expense:true, looking:true, found:false});
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity`, {signal:ctl.signal});
    clearTimeout(t);
    const d = await res.json();
    if (MODAL && MODAL.type === 'scanNew' && MODAL.code === code && d && d.product){
      const p = d.product, name = [p.brands && p.brands.split(',')[0], p.product_name].filter(Boolean).join(' ').trim();
      if (name && !MODAL.name) MODAL.name = name;
      const q = parseQty(p.quantity); if (q){ MODAL.packQty = q[0]; MODAL.packUnit = q[1]; }
      MODAL.found = !!name;
    }
  } catch(e){}
  if (MODAL && MODAL.type === 'scanNew' && MODAL.code === code){ MODAL.looking = false; renderModal(); }
}

const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
function periodRange(){
  const R = S.ui.rp, t = today(), ym = thisMonth();
  if (R.period === 'last'){ const p = shiftMonth(ym, -1); return [p + '-01', p + '-' + pad2(daysInMonth(p)), monthLabel(p)]; }
  if (R.period === '3m'){ const p = shiftMonth(ym, -2); return [p + '-01', t, `${monthLabel(p)} – ${monthLabel(ym)}`]; }
  if (R.period === 'fy'){ const d = new Date(), y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return [`${y}-04-01`, t, `Financial year ${y}–${String(y + 1).slice(2)}`]; }
  if (R.period === 'all'){ const first = S.entries.map(e => e.date).sort()[0] || t; return [first, t, 'All time']; }
  if (R.period === 'custom'){ const f = R.from || ym + '-01', to = R.to || t; return f <= to ? [f, to, `${fmtDate(f)} – ${fmtDate(to)}`] : [to, f, `${fmtDate(to)} – ${fmtDate(f)}`]; }
  return [ym + '-01', t, monthLabel(ym)];
}
function reportData(){
  const [from, to, label] = periodRange();
  const es = S.entries.filter(e => e.date >= from && e.date <= to);
  const sales = es.filter(e => e.kind === 'sale').reduce((a, e) => a + num(e.amount), 0);
  const exp = es.filter(e => e.kind === 'expense').reduce((a, e) => a + num(e.amount), 0);
  const months = []; let ym = from.slice(0, 7);
  while (ym <= to.slice(0, 7) && months.length < 60){ months.push(monthBE(ym)); ym = shiftMonth(ym, 1); }
  const fixed = months.reduce((a, b) => a + b.base, 0), profit = sales - exp - fixed;
  const group = kind => { const o = {}; es.filter(e => e.kind === kind).forEach(e => o[e.cat] = (o[e.cat] || 0) + num(e.amount)); return Object.entries(o).sort((a, b) => b[1] - a[1]); };

function loadScript(src){
  return new Promise((res, rej) => {
    const old = document.querySelector(`script[data-src="${src}"]`);
    if (old){ if (old.dataset.ok) return res(); old.addEventListener('load', () => res()); old.addEventListener('error', () => rej(new Error('load'))); return; }
    const s = document.createElement('script'); s.src = src; s.dataset.src = src;
    const to = setTimeout(() => { s.remove(); rej(new Error('load')); }, 15000);
    s.onload = () => { clearTimeout(to); s.dataset.ok = '1'; res(); }; s.onerror = () => { clearTimeout(to); s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  });
}

  const r = await gFetch('https://openidconnect.googleapis.com/v1/userinfo'); const u = await r.json();
  if (AUTH.email && u.email && u.email.toLowerCase() !== AUTH.email){ GTOK = null; try { sessionStorage.removeItem('swter.tok'); } catch(e){} throw new Error(`You signed in as ${u.email}, but this phone is linked to ${AUTH.email}. Sync needs the same Gmail.`); }
  SYNC.checked = AUTH.email; saveSync();
}
async function syncNow(interactive){
  if (SYNCING || !SYNC.on || LOCKED) return; SYNCING = true; setSyncState('syncing');
  try {
    await gToken(!interactive);
    await checkAccount();
    const q = encodeURIComponent(`name = '${SYNC_FILE}' and trashed = false`);
    const list = await (await gFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`)).json();
    const f = (list.files || [])[0];
    let changed = false;
    if (f){ const remote = migrate(await (await gFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json()); if (remote) changed = mergeRemote(remote); }
    const body = JSON.stringify(syncPayload());
    if (f) await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
    else { const b = 'bp' + uid(); await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b},

    SYNC.last = new Date().toISOString(); saveSync(); SYNCING = false; setSyncState('ok');
    if (changed && !LOCKED){ if (document.activeElement && document.activeElement.matches('input,select,textarea')) PENDING_RENDER = true; else render(); if (interactive) toast('Synced with your other devices'); }
  } catch(e){ SYNCING = false; setSyncState(e && e.message === 'needs-tap' ? 'tap' : 'error', e && e.message !== 'needs-tap' ? e.message : ''); if (interactive && e && e.message !== 'needs-tap') toast(e.message); }
}

  card: el => { openCard(el.dataset.id || S.ui.recipe, el.dataset.lot ? (() => { const f = S.finished.find(x => x.id === el.dataset.lot); return f ? {made:f.made, best:f.exp, pcs:Math.min(num(f.left), 6)} : {}; })() : null); return false; },
  cardShare: () => { (async () => { const c = $('#cardCanvas'); await drawCard(c); c.toBlob(async b => { if (!b) return toast('Could not make the image'); const n = `${(recById(MODAL.recipeId) || {}).name || 'product'}`.replace(/[^\w-]+/g, '-'); const res = await shareOrSave(`Swt-er-${n}.png`, b, 'Swt-er', cardCaption()); if (res === 'saved') toast('Image downloaded. Send it on WhatsApp with the caption.'); }, 'image/png'); })(); return false; },
  cardCaption: () => { copyText(cardCaption()); return false; },
  needSave: () => { const r = curRecipe(), f = needFactor(r); if (!f) return false; const c = scaledRecipe(r, f, fmtQty(needG(), 'g') + ' batter'); if (num(r.batterQty)) c.batterQty = +(num(r.batterQty) * f).toFixed(2); S.recipes.push(c); S.ui.recipe = c.id; S.ui.needQty = ''; markApplied(c, recipeSnap(r), 'top', `New recipe saved: ${c.name}`); window.scrollTo(0, 0); },
  needApply: () => { const r = curRecipe(), f = needFactor(r); if (!f) return false; const b = recipeSnap(r); r.lines.forEach(l => l.qty = +(num(l.qty) * f).toFixed(2)); if (num(r.batterQty)) r.batterQty = +(num(r.batterQty) * f).toFixed(2); r.yield = Math.max(1, Math.round(num(r.yield) * f)); S.ui.needQty = ''; markApplied(r, b, 'sec-ing', 'Recipe resized to ' + fmtQty(Math.round(batchWeight(r).raw), 'g') + ' of batter'); },
  useEst: () => { const r = curRecipe(), b = recipeSnap(r), bw = batchWeight(r); r.batterUnit = bw.est >= 1000 ? 'kg' : 'g'; r.batterQty = r.batterUnit === 'kg' ? +(bw.est / 1000).toFixed(2) : Math.round(bw.est); markApplied(r, b, 'sec-ing', 'Batter weight set from the estimate'); },
  dismissApplied: () => { S.ui.applied = null; },
  recipePdf: () => { (async () => { try { const r = curRecipe(), d = await recipePDF(r); await saveFile(`Recipe-${r.name.replace(/[^\w-]+/g, '-')}.pdf`, d.output('blob')); toast('Recipe card ready'); } catch(e){ toast('The PDF could not be made here.'); } })(); return false; },
  shopList: () => { openModal({type:'shop'}); return false; },
  shopCopy: () => { copyText(shopListText(shopListItems())); return false; },
  shopShare: () => { const t = shopListText(shopListItems()); (async () => { try { if (navigator.share){ await navigator.share({title:'Shopping list', text:t}); return; } } catch(e){ if (e && e.name === 'AbortError') return; } copyText(t); })(); return false; },
  /* account & lock */
  relink: () => { showGate('link', true); return false; },
  secBio: () => { showGate('setlock', true); return false; },
  secPin: () => { GATE.back = ''; showGate('pin', true); return false; },
  lockNow: () => { startGate(); return false; },
  /* data */
  askConfirm: el => { S.ui.confirm = el.dataset.key; if (dlg.open){ renderModal(); return false; } },
  cancelConfirm: () => { S.ui.confirm = ''; if (dlg.open){ renderModal(); return false; } },
  backup: () => { copyText(JSON.stringify(S)); return false; },
  backupFile: () => { saveFile(`swt-er-backup-${today()}.json`, JSON.stringify(S), 'application/json'); return false; },
  restore: () => { if (!restoreFromText($('#restoreBox').value)) return false; },
  reset: () => { const st = S.settings, bk = S.backup; S = sample(); resetSnap(); S.settings = st; S.backup = bk; toast('Sample data loaded. Clear it from the Dashboard when you are done exploring.'); location.hash = 'home'; },
  wipe: () => { const st = S.settings, bk = S.backup; S = blankState(); resetSnap(); S.settings = st; S.backup = bk; save(); toast('Everything cleared. Start with Get started.'); location.hash = 'home'; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (a !== 'closeModalNav') e.preventDefault();
  if (a !== 'askConfirm' && a !== 'cancelConfirm') S.ui.confirm = '';
  const snap = UNDOABLE[a] ? JSON.stringify(S) : null;
  const res = ACT[a](el);
  if (snap && res !== false) setTimeout(() => showUndo(UNDOABLE[a], snap), 0);
  save();
  if (res === 'nav') return;
  if (res !== false) render();
});

load();
startGate();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
