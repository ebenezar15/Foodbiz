<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batch &amp; Price</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky brand bar + scrollable tab strip; each tab is a form column beside a live result column, stacking to one column on phones */
:root{
  --bg:#F4F5EF; --surface:#FFFFFF; --surface-2:#EBEEE3; --ink:#2A1C15; --muted:#685E56; --line:#D8D9CD;
  --accent:#4A772E; --accent-ink:#FFFFFF; --accent-soft:#E0EBD3;
  --cocoa:#4B2F22; --cocoa-ink:#F7EFE8; --gold:#A86C00; --gold-soft:#F8EACA;
  --good:#2C7444; --good-soft:#DCEFE1; --warn:#9A5F0C; --warn-soft:#FAEACD; --bad:#B42318; --bad-soft:#FBE2DE;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15110E; --surface:#1F1915; --surface-2:#29221D; --ink:#F0E9E2; --muted:#B3A89E; --line:#3A3029;
    --accent:#9CCB7B; --accent-ink:#15210C; --accent-soft:#283A1E;
    --cocoa:#2B1D16; --cocoa-ink:#F3E8DE; --gold:#E7B451; --gold-soft:#3A2D13;
    --good:#73C890; --good-soft:#1C3324; --warn:#E6AC52; --warn-soft:#3A2B12; --bad:#F38B7E; --bad-soft:#3E1F1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#1F1915; --surface-2:#29221D; --ink:#F0E9E2; --muted:#B3A89E; --line:#3A3029;
  --accent:#9CCB7B; --accent-ink:#15210C; --accent-soft:#283A1E;
  --cocoa:#2B1D16; --cocoa-ink:#F3E8DE; --gold:#E7B451; --gold-soft:#3A2D13;
  --good:#73C890; --good-soft:#1C3324; --warn:#E6AC52; --warn-soft:#3A2B12; --bad:#F38B7E; --bad-soft:#3E1F1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cocoa)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num,.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cocoa);color:var(--cocoa-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-size:1.15rem;letter-spacing:-.01em}
.brand span{font-size:.8rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:var(--cocoa-ink);opacity:.78;text-decoration:none;padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:500}
.tabs a:hover{opacity:1}
.tabs a[aria-current="page"]{background:var(--cocoa-ink);color:var(--cocoa);opacity:1}
.tabs a:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{padding-block:22px 60px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head p{max-width:62ch;margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:880px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card > h3{margin-bottom:12px}
.card > h3 + p{margin-top:-6px;margin-bottom:12px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:880px),(max-height:760px){.sticky{position:static}}
.result{background:var(--surface);border:1.5px solid var(--accent);}
.qnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;margin-right:8px;font-family:var(--font-body)}

/* form */
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.field{display:grid;gap:4px;align-content:start;min-width:0}
.field > label,.lbl{font-size:.82rem;font-weight:600;color:var(--ink)}
.hint{font-size:.78rem;color:var(--muted);line-height:1.4}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.unitin{display:flex;align-items:center;gap:6px}
.unitin input{width:90px}
.unitin span{font-size:.8rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:500;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.8rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}

/* tables */
.tbl{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td select{min-width:150px}
td input[type=number]{min-width:70px}
td input[type=text],td input:not([type]){min-width:150px}
tfoot td{font-weight:700;border-top:1.5px solid var(--ink)}

/* results */
.big{font-family:var(--font-display);font-size:2.5rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mid{font-family:var(--font-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv .total{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.86rem}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .fill.gold{background:var(--gold)}
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);align-items:center}
.rung.rec{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.rung b{font-size:.95rem}
.rung .p{font-family:var(--font-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rung.rec .p{font-size:1.8rem}
.rung .d{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--surface-2);color:var(--muted)}
.tips{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.tips li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.tips li.bad{background:var(--bad-soft)} .tips li.warn{background:var(--warn-soft)} .tips li.good{background:var(--good-soft)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--muted)}
.bad .dot{background:var(--bad)} .warn .dot{background:var(--warn)} .good .dot{background:var(--good)} .info .dot{background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--font-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v.pos{color:var(--good)} .tile .v.neg{color:var(--bad)}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.empty{text-align:center;padding:28px;color:var(--muted)}
.example{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.labelcard{border:1.5px dashed var(--ink);border-radius:10px;padding:14px;font-size:.86rem;display:grid;gap:4px;background:var(--bg)}
.vegmark{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--good);vertical-align:-3px;margin-right:6px}
.vegmark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.guide{display:grid;gap:16px}
.guide ul,.guide ol{margin:6px 0 0;padding-left:1.2em;display:grid;gap:5px;font-size:.92rem}
.guide p{font-size:.92rem;max-width:70ch}
.guide p + p{margin-top:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20}
pre.msg{white-space:pre-wrap;font-family:var(--font-body);font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;max-height:340px;overflow:auto}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s ease}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="7" width="24" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 15.5h24M11 7v17M19 7v17" stroke="currentColor" stroke-width="1.6" opacity=".7"/><circle cx="24" cy="6" r="4" fill="#E7B451"/></svg>
      <div style="display:grid;min-width:0"><b>Batch &amp; Price</b><span id="biz"></span></div>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="Sections"></nav></div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const thisMonth = () => today().slice(0, 7);
function inr(n, dec){
  if (n == null || !isFinite(n)) return '—';
  const d = dec != null ? dec : (Math.abs(n) < 100 ? 2 : 0);
  return (n < 0 ? '−₹' : '₹') + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits: d, minimumFractionDigits: 0});
}
const pct = n => isFinite(n) ? Math.round(n) + '%' : '—';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function copyText(text){
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), () => toast('Copy blocked. Select the text and copy it.')); }
  catch(e){ toast('Copy blocked. Select the text and copy it.'); }
}

/* ============ reference data ============ */
const UNITS = {kg:['g',1000], g:['g',1], L:['ml',1000], ml:['ml',1], pcs:['pcs',1], dozen:['pcs',12]};
const CATS = [
  {id:'moist', name:'Moist bakes: brownies, tea cakes, muffins, banana bread', room:3, fridge:7, freezer:60,
   signs:'Sour or fermented smell, white or green fuzzy spots, a sticky wet surface.',
   store:'Store in an airtight container at room temperature, away from sunlight. Refrigerate after day 2 in hot weather.'},
  {id:'dry', name:'Dry bakes: cookies, nankhatai, rusk, biscotti', room:14, fridge:21, freezer:90,
   signs:'Soft or chewy where it should snap, a stale or paint-like (rancid) smell from butter or nuts.',
   store:'Keep in an airtight container in a cool, dry place. Do not refrigerate; it softens them.'},
  {id:'cream', name:'Cream & frosted: fresh-cream cakes, cheesecake, cupcakes', room:0.25, fridge:3, freezer:30,
   signs:'Weeping or sour cream, separated frosting, off smell.',
   store:'Keep refrigerated (0–5 °C). Take out 15–20 minutes before serving.'},
  {id:'milk', name:'Milk sweets: peda, barfi, kalakand, rasgulla', room:1, fridge:5, freezer:30,
   signs:'Sour smell, slimy surface, hard dark edges, mould.',
   store:'Keep refrigerated. Consume by the best-before date.'},
  {id:'ghee', name:'Ghee & dry-fruit sweets: besan or rava laddoo, chikki, dry-fruit barfi', room:15, fridge:30, freezer:60,
   signs:'Rancid smell from ghee or nuts, chikki turning sticky.',
   store:'Store in an airtight container in a cool, dry place.'},
  {id:'fried', name:'Fried snacks: namkeen, chakli, mathri, chips', room:30, fridge:null, freezer:null,
   signs:'Rancid oil smell, loss of crunch.',
   store:'Store in an airtight container in a cool, dry place. Reseal after opening.'},
  {id:'choc', name:'Chocolates, bars & truffles', room:14, fridge:30, freezer:90,
   signs:'White streaks (bloom) are safe but look stale. A sour smell in cream fillings means spoiled.',
   store:'Store below 25 °C, away from heat and sunlight.'},
  {id:'preserve', name:'Pickles, jams & preserves', room:180, fridge:365, freezer:null,
   signs:'Mould on top, bulging lid, fizzing, off smell.',
   store:'Store in a cool, dry place. Use a clean, dry spoon. Refrigerate jams after opening.'},
  {id:'bread', name:'Breads & buns (no preservatives)', room:2, fridge:5, freezer:60,
   signs:'Mould spots, sour or alcohol smell.',
   store:'Keep in a bread bag at room temperature. Freeze for longer storage.'},
  {id:'meal', name:'Home meals, curries, biryani', room:0.17, fridge:2, freezer:30,
   signs:'Sour smell, bubbles, slimy texture.',
   store:'Refrigerate within 2 hours of cooking. Reheat until piping hot.'}
];
const catById = id => CATS.find(c => c.id === id) || CATS[0];
const PRODUCTS = ['Brownies','Cookies','Cakes & cupcakes','Indian sweets','Chocolates','Savoury snacks','Pickles & preserves','Breads','Home meals'];
const CHANNELS = ['WhatsApp / Instagram','Home pickup','Swiggy / Zomato','Cafés & shops (resale)','Exhibitions & pop-ups','Corporate & events'];
const EXP_CATS = ['Ingredients','Packaging','Gas & electricity','Equipment','Delivery','Marketing','Licences & fees','Other'];
const SALE_CATS = ['Individual','Bulk','Corporate / event','Delivery app','Café / reseller'];

/* ============ state ============ */
const KEY = 'batchprice.v1';
function sample(){
  const I = (name, packQty, packUnit, packPrice) => ({id:uid(), name, packQty, packUnit, packPrice, updated:today()});
  const ingredients = [
    I('Maida (all-purpose flour)',1,'kg',52), I('Sugar',1,'kg',48), I('Brown sugar',500,'g',95),
    I('Butter (salted)',500,'g',285), I('Eggs',30,'pcs',210), I('Cocoa powder',250,'g',320),
    I('Dark compound chocolate',500,'g',240), I('Walnuts',250,'g',320), I('Vanilla essence',50,'ml',65),
    I('Baking powder',100,'g',45), I('Salt',1,'kg',28), I('Besan (gram flour)',1,'kg',110),
    I('Ghee',1,'kg',680), I('Cashews',250,'g',260), I('Cardamom',50,'g',220),
    I('Milk',1,'L',68), I('Condensed milk',400,'g',155)
  ];
  const by = n => ingredients.find(i => i.name.startsWith(n)).id;
  const K = (name, price, note) => ({id:uid(), name, price, note});
  const packaging = [
    K('Butter paper square',1,'One per piece'), K('Kraft brownie box, 6 cavity',24,'With window'),
    K('Brand sticker / label',2,'Printed, 50 mm round'), K('Single-piece glassine bag',3,''),
    K('Mithai box, 500 g',16,'Paper board with butter-paper liner'), K('Cookie zip pouch, 250 g',7,'Stand-up with window'),
    K('Ribbon',3,'Gift orders only')
  ];
  const pby = n => packaging.find(p => p.name.startsWith(n)).id;
  const L = (n, q) => ({id:uid(), ingId:by(n), qty:q});
  const P = (n, per) => ({id:uid(), pkgId:pby(n), perPieces:per});
  const recipes = [
    {id:uid(), name:'Fudgy walnut brownie', cat:'moist', yield:16, unitName:'piece', pieceWeight:55, wastage:5, bakeMin:30, preheatMin:10, gasMin:5, activeMin:45, margin:45, mktLow:60, mktHigh:110,
     lines:[L('Butter',200),L('Dark compound',200),L('Sugar',250),L('Eggs',4),L('Maida',120),L('Cocoa',40),L('Vanilla',5),L('Salt',2),L('Walnuts',60)],
     pack:[P('Butter paper',1),P('Kraft brownie',6),P('Brand sticker',6)]},
    {id:uid(), name:'Chocolate chip cookies', cat:'dry', yield:24, unitName:'cookie', pieceWeight:40, wastage:4, bakeMin:24, preheatMin:10, gasMin:0, activeMin:50, margin:45, mktLow:25, mktHigh:50,
     lines:[L('Maida',280),L('Butter',225),L('Brown sugar',200),L('Sugar',100),L('Eggs',2),L('Dark compound',200),L('Baking powder',4),L('Vanilla',5),L('Salt',3)],
     pack:[P('Cookie zip',8),P('Brand sticker',8)]},
    {id:uid(), name:'Besan laddoo', cat:'ghee', yield:30, unitName:'laddoo', pieceWeight:40, wastage:3, bakeMin:0, preheatMin:0, gasMin:35, activeMin:70, margin:40, mktLow:18, mktHigh:35,
     lines:[L('Besan',500),L('Ghee',300),L('Sugar',400),L('Cashews',50),L('Cardamom',3)],
     pack:[P('Mithai box',12),P('Brand sticker',12)]}
  ];
  const F = (name, amt) => ({id:uid(), name, amt});
  const profile = {
    business:'', products:['Brownies','Cookies','Indian sweets'], channels:['WhatsApp / Instagram','Corporate & events'], buyers:'both',
    monthlyPieces:400, ovenWatts:1500, elecRate:8, lpgPrice:900, burnerKgHr:0.17, labourRate:150,

  // example tracker entries, last 4 months

let S;
function load(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  S = saved && saved.v === 1 ? saved : sample();
  const base = sample();
  for (const k of Object.keys(base)) if (S[k] == null) S[k] = base[k];
  for (const k of Object.keys(base.profile)) if (S.profile[k] == null) S.profile[k] = base.profile[k];
  S.ui = Object.assign({}, base.ui, S.ui, {confirm:''});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ============ calculations ============ */
const ingById = id => S.ingredients.find(i => i.id === id);
const pkgById = id => S.packaging.find(p => p.id === id);
const recById = id => S.recipes.find(r => r.id === id);
const baseUnit = g => (UNITS[g.packUnit] || UNITS.g)[0];
const perBase = g => { const m = (UNITS[g.packUnit] || UNITS.g)[1]; const q = num(g.packQty) * m; return q > 0 ? num(g.packPrice) / q : 0; };
const sumFixed = () => S.profile.fixed.reduce((a, f) => a + num(f.amt), 0);
function recipeCost(r){
  const P = S.profile;
  let ingr = 0;
  r.lines.forEach(l => { const g = ingById(l.ingId); if (g) ingr += num(l.qty) * perBase(g); });
  const ingW = ingr * (1 + num(r.wastage) / 100);
  const ovenMin = num(r.bakeMin) > 0 ? num(r.bakeMin) + num(r.preheatMin) : 0;
  const kwh = num(P.ovenWatts) / 1000 * ovenMin / 60 * 0.7;          // thermostat cycles ~70% of the time
  const elec = kwh * num(P.elecRate);
  const gas = num(r.gasMin) / 60 * num(P.burnerKgHr) * num(P.lpgPrice) / 14.2;
  const labour = num(r.activeMin) / 60 * num(P.labourRate);
  const batch = ingW + elec + gas + labour;
  const y = Math.max(1, num(r.yield));
  let pack = 0;
  r.pack.forEach(p => { const k = pkgById(p.pkgId); if (k) pack += num(k.price) / Math.max(1, num(p.perPieces)); });
  const fixed = sumFixed() / Math.max(1, num(P.monthlyPieces));
  const perPiece = batch / y + pack + fixed;
  return {ingr, ingW, elec, gas, labour, batch, pack, fixed, perPiece, variable: perPiece - fixed, y, kwh};
}
function priceFor(cost, margin, fee = 0){ const d = 1 - margin / 100 - fee / 100; return d > 0.05 ? cost / d : NaN; }
function roundPrice(p){
  if (!isFinite(p)) return p;
  if (S.profile.rounding === 'none') return Math.ceil(p);
  const step = p < 20 ? 1 : p < 100 ? 5 : p < 500 ? 10 : 50;
  let c = Math.ceil(p / step) * step;
  if (step >= 5 && c % 10 === 0 && c - 1 >= p) c -= 1;
  return c;
}
const recPrice = r => roundPrice(priceFor(recipeCost(r).perPiece, num(r.margin)));
function tierFor(qty){
  let d = 0;
  [...S.profile.tiers].sort((a, b) => num(a.min) - num(b.min)).forEach(t => { if (num(qty) >= num(t.min)) d = num(t.disc); });
  return d;
}
const marginOf = (price, cost, fee = 0) => price > 0 ? (price * (1 - fee / 100) - cost) / price * 100 : NaN;
const health = m => m >= 25 ? ['good','Healthy'] : m >= 10 ? ['warn','Thin'] : ['bad', m < 0 ? 'Loss' : 'Too low'];

/* ============ small builders ============ */
const fid = p => 'f-' + p.replace(/\./g, '-');
const fld = (label, control, hint, forPath) => `<div class="field">${forPath ? `<label for="${fid(forPath)}">${label}</label>` : `<span class="lbl">${label}</span>`}${control}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const numIn = (path, val, attrs = '') => `<input type="number" inputmode="decimal" step="any" min="0" id="${fid(path)}" data-path="${path}" data-num value="${esc(val)}" ${attrs}>`;
const txtIn = (path, val, attrs = '') => `<input type="text" id="${fid(path)}" data-path="${path}" value="${esc(val)}" ${attrs}>`;
const sel = (path, val, opts) => `<select id="${fid(path)}" data-path="${path}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
const F = (label, path, val, hint, kind = 'num', extra) => fld(label, kind === 'num' ? numIn(path, val, extra) : txtIn(path, val, extra), hint, path);
const tipList = list => `<ul class="tips">${list.map(t => `<li class="${t[0]}"><span class="dot"></span><span>${t[1]}</span></li>`).join('')}</ul>`;
function confirmBtn(key, label, act, data = ''){
  return S.ui.confirm === key
    ? `<button class="btn small danger" data-act="${act}" ${data}>Confirm: ${label}</button> <button class="btn small" data-act="cancelConfirm">Keep</button>`
    : `<button class="btn small" data-act="askConfirm" data-key="${key}">${label}</button>`;
}
function curRecipe(){ let r = recById(S.ui.recipe); if (!r && S.recipes.length){ r = S.recipes[0]; S.ui.recipe = r.id; } return r; }
function recipePicker(){
  return `<div class="picker" role="group" aria-label="Choose a product">

function suggestions(){
  const P = S.profile, out = [];
  const fixedPer = sumFixed() / Math.max(1, num(P.monthlyPieces));
  if (num(P.labourRate) <= 0) out.push(['bad','Your time is set to ₹0 an hour. Prices that ignore your time look profitable on paper but leave you working for free. Put in what you would pay a helper.']);
  else if (num(P.labourRate) < 80) out.push(['warn',`₹${P.labourRate} an hour is low for skilled kitchen work. If you later hire help, your prices must already cover it.`]);
  if (P.fssai !== 'yes') out.push(['bad','Register with FSSAI before selling. Home businesses with turnover up to ₹12 lakh a year need only Basic Registration on the FoSCoS portal (₹100 a year). Print the 14-digit number on every label.']);
  if (num(P.margin) < 25) out.push(['warn',`A ${P.margin}% margin leaves little room for failed batches, price rises or discounts. 35–50% is a sounder target for home food.`]);
  if (num(P.margin) > 70) out.push(['info','Margins above 70% are possible for premium gifting, but check the Pricing tab against what others charge nearby.']);
  if (P.channels.includes('Swiggy / Zomato') && num(P.platformFee) < 15) out.push(['warn','Delivery apps usually keep a commission plus fees on every order, often 20–30%. Enter it under "Delivery-app commission" so your app prices are set higher than direct prices.']);
  if (P.channels.includes('Cafés & shops (resale)')) out.push(['info','Cafés and shops expect a wholesale price, often 25–35% below your retail price, so they can make their own margin. Check your bulk tiers still show "Healthy" at that discount.']);
  if (P.channels.includes('Exhibitions & pop-ups')) out.push(['info','Add stall fees, travel and samples as a separate expense for each event, and price event packs so a typical day covers the stall at least three times over.']);
  if (P.channels.includes('Corporate & events')) out.push(['info','Corporate buyers often ask for a GST invoice, a tasting sample and a fixed quote. Keep a printed rate card and quote validity (7 days is common).']);
  if (P.buyers !== 'individual') out.push(['good',`For bulk orders: take a ${S.quote.advance || 50}% advance, set a minimum order (you have ${P.minOrder} pieces), and give at least ${P.leadDays} days' lead time. Bulk discounts come from your saved time, not your ingredient money.`]);
  if (fixedPer > 8) out.push(['warn',`Your fixed costs add ${inr(fixedPer)} to every piece because monthly volume is ${P.monthlyPieces}. Selling more pieces, or trimming fixed costs, lowers this.`]);
  if (P.products.includes('Indian sweets') || P.products.includes('Cakes & cupcakes')) out.push(['info','Milk sweets and fresh-cream cakes last only days. Make them to order and use the Shelf life tab to set a safe best-before date.']);
  if (P.products.includes('Savoury snacks') || P.products.includes('Pickles & preserves') || P.products.includes('Cookies')) out.push(['good','Snacks, cookies and pickles keep well, so they suit courier orders and stock-ahead selling. A ₹1,000–1,500 heat sealer pays for itself quickly.']);
  if (P.gst === 'yes') out.push(['info',`You are GST registered: add ${P.gstRate}% GST on invoices and show prices "inclusive of GST" on menus.`]);
  else out.push(['info','Not GST registered? Then do not charge GST. For goods, registration is usually needed once yearly turnover crosses ₹40 lakh (₹20 lakh in some states), or earlier for some app or interstate selling. Check with a CA.']);
  out.push(['info',`Check your electricity bill for the rate per unit in your slab. At ₹${P.elecRate}/unit, a ${P.ovenWatts} W oven costs about ${inr(P.ovenWatts/1000*0.7*P.elecRate)} an hour to run.`]);
  return out;
}

function oPricing(){

  const rung = (label, marg, desc, cls = '') => {

    const mm = marginOf(pr, c.perPiece);
    return `<div class="rung ${cls}"><b>${label}</b><span class="p">${inr(pr)}</span><span class="d">${desc}${marg > 0 ? ` · keeps ${pct(mm)}, ${inr(pr - c.perPiece)} each` : ''}</span></div>`;

  }

  const kg = num(r.pieceWeight) > 0 ? rec / num(r.pieceWeight) * 1000 : 0;

    </dl>

  // tiers
  $$('[data-tier]').forEach(el => {
    const t = P.tiers[+el.dataset.tier]; if (!t) return;
    const unit = Math.round(rec * (1 - num(t.disc) / 100)), mm = marginOf(unit, c.perPiece), h = health(mm);

  });

    </div>
    ${tipList([
      ['info', `If ingredient prices rise 10%, cost goes to ${inr(up10)} and your margin at ${inr(rec)} drops to ${pct(marginOf(rec, up10))}.`],

      ['info', 'Charge delivery separately, and charge extra for custom messages, toppers or gift wrap.']

function quoteCalc(){
  const Q = S.quote, P = S.profile;
  let sub = 0, cost = 0, pcs = 0;
  const rows = Q.rows.map(row => {
    const r = recById(row.recipeId); if (!r) return null;
    const c = recipeCost(r), base = recPrice(r), qty = num(row.qty), disc = tierFor(qty);
    const unit = Math.round(base * (1 - disc / 100)), line = unit * qty;
    sub += line; cost += c.perPiece * qty; pcs += qty;
    return {r, qty, base, disc, unit, line, cat:r.cat};
  }).filter(Boolean);
  const custom = num(Q.customPack) * pcs, rush = Math.round(sub * num(Q.rush) / 100), delivery = num(Q.delivery);
  const taxable = sub + custom + rush;
  const gst = P.gst === 'yes' ? Math.round(taxable * num(P.gstRate) / 100) : 0;
  const total = taxable + delivery + gst;
  const profit = sub + rush - cost;
  return {rows, sub, cost, pcs, custom, rush, delivery, gst, total, profit, margin: marginOf(sub + rush, cost), advance: Math.ceil(total * num(Q.advance) / 100)};
}

function trackerTips(m, byCat){
  const t = [];
  if (m.sales && m.profit / m.sales < 0.2) t.push(['warn', 'Profit is under 20% of sales this month. Compare your actual prices with the Pricing tab, and check for discounts you did not plan.']);
  if (m.sales && (byCat['Ingredients'] || 0) / m.sales > 0.45) t.push(['warn', 'Ingredients are more than 45% of sales. Buy butter, chocolate and nuts in bulk, or review recipe quantities and wastage.']);
  if (m.sales && (byCat['Packaging'] || 0) / m.sales > 0.15) t.push(['warn', 'Packaging is above 15% of sales. Order boxes in larger lots or use simpler packaging for everyday orders.']);
  if (!t.length && m.sales) t.push(['good', 'Spending looks balanced against sales this month.']);

function chart6(ym){
  const ms = [5,4,3,2,1,0].map(k => shiftMonth(ym, -k));
  const data = ms.map(x => monthSum(x));
  const W = 560, H = 220, L = 52, B = 26, T = 10, R = 8;
  const max = Math.max(1000, ...data.map(d => Math.max(d.sales, d.exp)));
  const mag = Math.pow(10, Math.floor(Math.log10(max)));
  const stepv = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => max / s <= 5) || mag * 10;
  const top = Math.ceil(max / stepv) * stepv;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / 6, bw = Math.min(26, gw / 3);
  let g = '';
  for (let v = 0; v <= top + 0.1; v += stepv){
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v >= 1000 ? '₹' + (v / 1000).toLocaleString('en-IN') + 'k' : '₹' + v}</text>`;
  }
  data.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    g += `<rect x="${cx - bw - 1}" y="${y(d.sales)}" width="${bw}" height="${Math.max(0, H - B - y(d.sales))}" rx="3" fill="var(--accent)"><title>${monthLabel(ms[i])} sales ${inr(d.sales)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0, H - B - y(d.exp))}" rx="3" fill="var(--gold)"><title>${monthLabel(ms[i])} expenses ${inr(d.exp)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${ms[i] === ym ? 'var(--ink)' : 'var(--muted)'}" font-weight="${ms[i] === ym ? 700 : 400}">${monthLabel(ms[i]).split(' ')[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales and expenses for the last six months">${g}</svg>`;
}

function shelfCalc(s){
  const c = catById(s.cat);
  let room = c.room, fridge = c.fridge, freezer = c.freezer;
  const notes = [];
  if (s.climate === 'hot'){ room *= 0.6; notes.push(['warn', 'A hot or humid kitchen without AC cuts room-temperature life by about 40%. Indian summers and monsoons are when most home bakes spoil early.']); }
  if (s.fresh){ room = Math.min(room, 0.25); fridge = fridge == null ? 3 : Math.min(fridge, 3); notes.push(['bad', 'Fresh fruit, fresh cream, cream cheese or custard: keep it chilled, and treat 3 days in the fridge as the limit.']); }
  if (s.dairy && !['milk', 'cream'].includes(s.cat)){ room *= 0.7; if (fridge) fridge *= 0.85; notes.push(['warn', 'Khoya, paneer, milk or mawa in the recipe shortens life.']); }
  if (s.moisture === 'high'){ room *= 0.8; if (fridge) fridge *= 0.85; notes.push(['info', 'Very moist or gooey centres spoil faster than firm, dry ones.']); }
  if (s.moisture === 'low') room *= 1.15;
  const pk = {open:0.6, airtight:1, sealed:1.3}[s.pack] || 1;
  room *= pk; if (fridge) fridge *= Math.min(pk, 1.15);
  if (s.pack === 'open') notes.push(['warn', 'Loose wrapping (butter paper, an open tray) lets in air and moisture. Use a closed box or pouch.']);
  if (s.pack === 'sealed') notes.push(['good', 'Heat-sealed or vacuum packs slow staling and drying. They do not stop bacteria in moist or dairy foods.']);
  const useFridge = room < 1 || s.fresh || s.cat === 'cream' || s.cat === 'milk';
  return {c, room, fridge, freezer, useFridge, notes, label: (useFridge ? fridge : room) * 0.7};
}
function dur(d){
  if (d == null) return 'Not advised';
  if (d < 1) return Math.max(1, Math.round(d * 24)) + ' hours';
  if (d >= 60) return Math.round(d / 30) + ' months';
  const f = Math.floor(d); return f + (f === 1 ? ' day' : ' days');
}

function packAdvice(a){
  const c = catById(a.cat);
  const items = (PK[a.cat] || []).map(x => ({name:x[0], lo:x[1], hi:x[2]}));
  const tips = [];
  if (a.purpose === 'gift'){ items.push({name:'Rigid or window gift box', lo:40, hi:120}, {name:'Ribbon or twine', lo:2, hi:5}, {name:'Thank-you card or tag', lo:1, hi:3}); tips.push(['info', 'Gift orders can carry premium packaging. Price them at the Premium rung, not the everyday price.']); }
  if (a.purpose === 'everyday') tips.push(['good', 'For everyday orders keep packaging to about 5–12% of the selling price. Customers pay for what is inside.']);
  if (a.purpose === 'bulk'){ items.push({name:'Bulk tray or large box, 25–50 pieces', lo:20, hi:60}, {name:'Outer 3-ply corrugated carton', lo:15, hi:40}); tips.push(['info', 'Bulk and corporate orders: pack in trays and charge per-piece wrapping only if they will hand pieces out one by one.']); }
  if (a.distance === 'city') tips.push(['warn', 'Across the city: use a rigid box with the lid taped or stickered shut, keep boxes flat in a delivery bag, and do not stack heavy boxes on soft bakes.']);
  if (a.distance === 'courier'){
    items.push({name:'Bubble wrap', lo:5, hi:15}, {name:'Outer 3-ply corrugated box', lo:15, hi:40});
    const life = shelfCalc({cat:a.cat, climate:'hot', fresh:false, dairy:false, moisture:'normal', pack:'sealed'});
    tips.push(life.label >= 7 ? ['good', 'This product keeps long enough to courier. Heat-seal the inner pack, cushion it, and mark the box "Food, handle with care".'] : ['bad', `Not suited to courier. It keeps about ${dur(life.label)}, and courier takes 2–5 days. Sell it locally only.`]);
    if (a.cat === 'choc') tips.push(['warn', 'Chocolate melts above about 28 °C. Avoid shipping in summer, or use insulated packs and express delivery.']);
  }
  if (a.eco){ items.push({name:'Bagasse (sugarcane) box or tray', lo:6, hi:15}); tips.push(['info', 'Kraft paper and bagasse look good and compost, but paper is not a moisture barrier. Line it with butter paper, and keep crisp items in a sealed inner pouch.']); }
  if (a.cat === 'cream' || a.cat === 'milk') tips.push(['warn', 'Keep these cold until handover. Put a "Keep refrigerated" sticker on every box.']);
  tips.push(['info', 'Every pack needs a label: product name, ingredients, allergens, net weight, date of making, best-before, veg/non-veg mark, FSSAI number and your address. See the Guide tab.']);
  return {c, items, tips};
}

  if (path === 'ui.draft.kind') S.ui.draft.cat = val === 'sale' ? SALE_CATS[0] : EXP_CATS[0];
  save();
  if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'date' || final === 'change-struct') render(); else refresh();
}
document.addEventListener('input', e => { if (e.target.tagName !== 'SELECT' && e.target.type !== 'checkbox') onField(e); });
document.addEventListener('change', e => {
  if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') onField(e);
  else if (e.target.dataset && e.target.dataset.path && /\.(name|unitName)$/.test(e.target.dataset.path) && (cur() === 'recipes' || cur() === 'pantry')) render();
});
const blankRecipe = () => ({id:uid(), name:'New product', cat:'moist', yield:12, unitName:'piece', pieceWeight:0, wastage:5, bakeMin:25, preheatMin:10, gasMin:0, activeMin:45, margin:num(S.profile.margin), mktLow:0, mktHigh:0, lines:[], pack:[]});
const ACT = {
  pickRecipe: el => { S.ui.recipe = el.dataset.id; },
  addRecipe: () => { const r = blankRecipe(); if (S.ingredients[0]) r.lines.push({id:uid(), ingId:S.ingredients[0].id, qty:100}); S.recipes.push(r); S.ui.recipe = r.id; if (cur() !== 'recipes') location.hash = 'recipes'; },
  dupRecipe: () => { const r = JSON.parse(JSON.stringify(curRecipe())); r.id = uid(); r.name += ' (copy)'; S.recipes.push(r); S.ui.recipe = r.id; },
  delRecipe: () => { S.recipes = S.recipes.filter(r => r.id !== S.ui.recipe); S.ui.recipe = S.recipes[0] ? S.recipes[0].id : ''; S.quote.rows = S.quote.rows.filter(q => recById(q.recipeId)); },
  addLine: () => { const r = curRecipe(); r.lines.push({id:uid(), ingId:S.ingredients[0] ? S.ingredients[0].id : '', qty:0}); },
  addPack: () => { const r = curRecipe(); r.pack.push({id:uid(), pkgId:S.packaging[0] ? S.packaging[0].id : '', perPieces:1}); },
  addIng: () => { S.ingredients.push({id:uid(), name:'New ingredient', packQty:1, packUnit:'kg', packPrice:0, updated:today()}); },
  addPkg: () => { S.packaging.push({id:uid(), name:'New item', price:0, note:''}); },
  addFixed: () => { S.profile.fixed.push({id:uid(), name:'New cost', amt:0}); },
  addTier: () => { const t = S.profile.tiers; const last = t[t.length - 1]; t.push({id:uid(), min:last ? num(last.min) * 2 : 1, disc:last ? num(last.disc) + 3 : 0}); },
  addQRow: () => { S.quote.rows.push({id:uid(), recipeId:S.recipes[0] ? S.recipes[0].id : '', qty:S.profile.minOrder || 6}); },
  del: el => { const arr = getPath(el.dataset.list); arr.splice(+el.dataset.i, 1); },
  toggle: el => { const arr = getPath(el.dataset.path); const v = el.dataset.val; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); },
  addEntry: () => {
    const D = S.ui.draft; if (!num(D.amount)) { toast('Enter an amount first'); return false; }
    S.entries.push({id:uid(), date:D.date || today(), kind:D.kind, cat:D.cat, desc:D.desc, amount:num(D.amount)});
    S.ui.month = (D.date || today()).slice(0, 7); D.amount = ''; D.desc = ''; toast(D.kind === 'sale' ? 'Sale added' : 'Expense added');
  },
  delEntry: el => { S.entries = S.entries.filter(e => e.id !== el.dataset.id); },
  clearEx: () => { S.entries = S.entries.filter(e => !e.ex); },
  copyMsg: () => { copyText($('#out-msg').textContent); return false; },
  logSale: () => {
    const q = quoteCalc(); if (!q.total) { toast('The quote is empty'); return false; }
    const catMap = {individual:'Individual', bulk:'Bulk', corporate:'Corporate / event', reseller:'Café / reseller'};
    S.entries.push({id:uid(), date:today(), kind:'sale', cat:catMap[S.quote.type] || 'Individual', desc:(S.quote.customer || 'Order') + ` (${q.pcs} pcs)`, amount:q.total - q.gst});
    toast('Recorded in the Tracker'); save(); return false;
  },
  addAdvPkg: el => { const it = packAdvice(S.packAdv).items[+el.dataset.i]; S.packaging.push({id:uid(), name:it.name, price:Math.round((it.lo + it.hi) / 2), note:'From packaging advice'}); toast('Added to your packaging list'); },
  askConfirm: el => { S.ui.confirm = el.dataset.key; },
  cancelConfirm: () => { S.ui.confirm = ''; },
  backup: () => { copyText(JSON.stringify(S)); return false; },
  restore: () => {
    try { const d = JSON.parse($('#restoreBox').value); if (!d || d.v !== 1 || !d.profile) throw 0; localStorage.setItem(KEY, JSON.stringify(d)); load(); toast('Backup restored'); }
    catch(e){ toast('That text is not a Batch & Price backup'); return false; }
  },
  reset: () => { S = sample(); toast('Sample data loaded'); },
  wipe: () => { const s = sample(); S = Object.assign(s, {ingredients:[], packaging:[], recipes:[], entries:[]}); S.quote.rows = []; S.ui.recipe = ''; toast('Started empty'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  e.preventDefault();
  if (a !== 'askConfirm') S.ui.confirm = '';
  const keep = ACT[a](el);
  save();
  if (keep !== false) render();
});

load();
render();
</script>
</body>
</html>
